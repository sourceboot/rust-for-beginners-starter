# NO DEPENDENCIES, EVER — the empty section is the point, not an oversight.
# Everything this game needs — reading a line, picking a word, scoring a guess —
# is in the standard library, and writing it yourself IS the course. (No `rand`
# either: the word is picked by puzzle number, which is what makes two players
# able to race the same puzzle — and what makes every test deterministic.)
#
# `lantern` is the name of the crate and of the binary, and it is spelled out in
# exactly two places: this file and `src/banner.rs` (`GAME_NAME`).
[package]
name = "lantern"
version = "0.1.0"
edition = "2021"
# No build script, ever: the line below turns cargo's build.rs auto-detection off,
# so nothing of yours runs at compile time — the course's checks compile your
# library and nothing else. Every lab's rubric pins that line (`<mod>.manifest`).
build = false

[dependencies]
