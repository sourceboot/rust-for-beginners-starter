# Stable, pinned. This course never leaves the host: no bare-metal target, no
# nightly features, no emulator — a terminal game and `cargo test`. The whole
# toolchain is `rustup default stable`, and that is the point: this is the
# catalog's front door, and its floor is one install.
[toolchain]
channel = "stable"
# clippy is part of the grade from lab 01 on (each lab's `lint` run refuses the
# handful of calls this course forbids — see .cargo/clippy.toml). rustup installs
# a listed component the first time cargo runs here WHILE ONLINE; a `--profile
# minimal` install done offline must run `rustup component add clippy` once, or
# every cargo command in this folder fails, not just the lint (lab 00 says so).
components = ["clippy"]
